# Metadati, dipendenze, comandi e configurazione degli strumenti, in un file
# solo con un solo lock gestito da uv. Pubblicare Ares su PyPI resta un non
# obiettivo.

[project]
name = "ares"
version = "0.8.2"
description = "Assistente personale locale su Agno e Ollama"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"

# Il pavimento e' la versione installata dai setup e usata da mypy. Il tetto
# esclude la 3.14 solo perche' non e' ancora provata: la CI prova 3.12 e 3.13.

# Solo i pacchetti importati davvero, ognuno con il suo motivo; il resto
# arriva per transitivita'. I vincoli sono larghi perche' versioni esatte e
# hash stanno in uv.lock, che setup e CI installano con `uv sync --locked`.
# Un `<` compare solo per un'incompatibilita' nota, scritta accanto. Le
# versioni cambiano solo con un `uv lock` deliberato.
dependencies = [
    # Il framework dell'agente. Vincolo stretto perche' agno.learn cambia fra
    # minor e Ares usa alcuni interni: la 3.1 va provata prima di adottarla.
    "agno>=3.0.2,<3.1",
    # Client del server Ollama su localhost:11434. Serve sia al modello
    # conversazionale sia a OllamaEmbedder.
    "ollama",
    # Indice vettoriale delle intuizioni apprese, incorporato nel processo:
    # nessun servizio da avviare, nessun container.
    "lancedb",
    # Motore di ricerca full-text di LanceDB. Senza, SearchType.hybrid non ha
    # la meta' testuale e resta la sola distanza coseno, che su una collezione
    # piccola e' rumorosa.
    "tantivy",
    # Backend SQLite di Agno (SqliteDb): profilo, memorie, entita', sessioni e
    # il filesystem privato dell'agente. Non e' una dipendenza di agno base.
    "sqlalchemy",
    # Non lo usiamo: lo pretende l'__init__ di agno.models.ollama, che importa
    # OllamaResponses insieme a Ollama.
    "openai",
    # Carica le personalizzazioni locali da un file .env ignorato da Git.
    "python-dotenv",
    # Renderer della CLI: Markdown, streaming Live, pannelli, tabelle e tema.
    # Diretta perche' la importiamo, anche se arriva gia' con Agno.
    "rich",
    # Editor della REPL: completamento visuale, cronologia, suggerimenti e
    # input multilinea. Separato da Rich, che si occupa solo dell'output.
    "prompt-toolkit",
    # Il comando `ares` e i suoi sottocomandi, da firme e docstring delle
    # funzioni, con aiuto in Rich e completamento della shell. Il pavimento e'
    # la versione con cui l'aiuto e' stato disegnato.
    "cyclopts>=5.0.0",
    # Lock cooperativi condivisi/esclusivi su POSIX e Windows. L'extra win32
    # aggiunge pywin32 solo su Windows, dove serve per conservare i lock
    # condivisi usati dalle chat concorrenti.
    "portalocker[win32]",
    # Il database dei fusi orari per `zoneinfo`, che Windows non ha: senza,
    # il prompt riceverebbe un'ora senza fuso.
    "tzdata",
]

# I comandi installati nel venv. `ares` e' l'App intera (chat e
# sottocomandi); gli altri sono alias storici, `ares-backup list` e'
# `ares backup list`.
[project.scripts]
ares = "ares.cli.app:main"
ares-backup = "ares.backup.snapshots:main"
ares-entities = "ares.entities.maintenance:main"
ares-sessions = "ares.sessions.maintenance:main"
ares-preflight = "ares.ops.preflight:main"
ares-inspect = "ares.ops.inspect_learning:main"

[project.urls]
Repository = "https://github.com/KairosIta/Ares"

# Strumenti di sviluppo: `uv sync` li installa, `setup.sh` no (`--no-dev`).
# Senza pin per la stessa ragione delle dipendenze: una ruff nuova arriva
# solo con un `uv lock`, e se la CI diventa rossa e' per quel cambio.
[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "coverage",
]

# Il backend di uv, solo per l'installazione editable nel venv: uv usa la
# copia che porta con se', senza scaricare niente.
[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"

# Il package sta nella radice del progetto, non sotto src/.
[tool.uv.build-backend]
module-root = ""

# ---------------------------------------------------------------------------
# Linter e formattatore
# ---------------------------------------------------------------------------

[tool.ruff]
# Piu' largo degli 88 di default: descrive lo stile del codice esistente.
line-length = 120

[tool.ruff.lint]
# Esclusi di proposito:
#
#   PTH  vorrebbe Path.rename in backup/files.py, dove os.rename e' una
#        scelta motivata per la semantica di Windows.
#   D    la forma delle docstring non si impone per regola.
select = ["E", "W", "F", "I", "B", "C4", "PIE", "SIM", "RUF", "UP"]

# RUF001 segnala il `›` del prompt della REPL, che e' voluto.
ignore = ["RUF001"]

# ---------------------------------------------------------------------------
# Controllo dei tipi
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"

# Nessun `ignore_missing_imports`: tutte le dipendenze hanno py.typed. Se una
# nuova non lo avesse, si silenzia quella sola.
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Le prove restano fuori: frugano apposta negli interni del framework, e un
# loro errore di tipo si vede comunque perche' girano a ogni CI. Il codice di
# produzione ha rami che nessuna prova attraversa (Windows, gestori d'errore),
# ed e' li' che mypy serve. Il cablaggio delle prove (`tests/run.py`,
# `tests/_comune.py`, `tests/_doppi.py`) la CI lo nomina esplicitamente,
# scavalcando questo `exclude`.
exclude = ['^\.venv/', '^tests/']

# ---------------------------------------------------------------------------
# Misura di copertura
# ---------------------------------------------------------------------------
# Si misura il package, non le prove. `tests/run.py` legge questa
# configurazione, cosi' il numero non dipende da come e' invocato.

[tool.coverage.run]
# Il package intero, cosi' un modulo nuovo non resta fuori dalla misura.
source = ["ares"]
# Ogni prova e' un processo separato con un proprio file; `coverage combine`
# li unisce.
parallel = true
# I rami contano quanto le righe, e vanno chiesti.
branch = true
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
# Si mostrano righe e rami scoperti: qui i rami (Windows, errori, ripieghi)
# sono la sostanza.
show_missing = true
skip_covered = false
precision = 0
exclude_also = [
    # Il blocco di avvio di uno script non e' codice da coprire.
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
    'raise NotImplementedError',
]
