version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    # Gruppi per non pagare un giro di CI per pacchetto. Sviluppo e
    # produzione separati, perche' un pacchetto che rompe trattiene il suo
    # gruppo: il tooling non deve bloccare il runtime.
    groups:
      sviluppo:
        dependency-type: development
      produzione:
        dependency-type: production
        # Framework, client e indice hanno una PR ciascuno: vanno letti e
        # provati uno per uno.
        exclude-patterns:
          - agno
          - openai
          - lancedb
    labels:
      - dependencies
    # `uv_build` non e' nel lock: il suo pavimento coincide con la copia
    # integrata nell'uv della CI (0.12.2). Alzarlo da solo aggiungerebbe solo
    # un download; si muove insieme a uv, in `ci.yml` e `pyproject.toml`
    # nello stesso commit.
    ignore:
      - dependency-name: uv-build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    # Un gruppo solo: `init` e `analyze` di `codeql-action` devono avere la
    # stessa versione, e PR separate lascerebbero il workflow incoerente.
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
