# Vulnerabilita' note nelle dipendenze bloccate in uv.lock: ne' Dependabot
# (versioni nuove) ne' CodeQL (il codice di Ares) confrontano l'albero
# installato con gli advisory pubblicati.
#
# Fuori dai controlli obbligatori: un advisory e' una notizia, non una
# regressione del commit, e non deve bloccare una PR qualunque. Si legge
# quando compare e si corregge con un `uv lock`. Separato da `ci.yml` per il
# giro settimanale: gli advisory cambiano anche senza commit.

name: Audit

on:
  push:
    branches:
      - main
    # Su push e PR solo quando cambiano le dipendenze; il giro settimanale
    # gira comunque.
    paths:
      - uv.lock
      - pyproject.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
      - .github/workflows/audit.yml
  # Cron in UTC: 04:00, prima di CodeQL (05:00) e Dependabot (06:00).
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dipendenze:
    name: Vulnerabilita' note
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installa uv
        run: python -m pip install --disable-pip-version-check uv==0.12.2

      # L'elenco esatto del lock, per tutti i sistemi e gruppo dev compreso,
      # senza costruire il venv. `ares` stesso resta fuori: non ha advisory.
      - name: Elenca le dipendenze bloccate
        run: |
          uv export --frozen --no-emit-project --no-hashes \
            --format requirements-txt -o dipendenze.txt
          grep -cE '^[a-zA-Z0-9]' dipendenze.txt

      # `--no-deps`: l'elenco e' gia' risolto, e ririsolverlo guarderebbe
      # versioni che non si installano. pip-audit e' pinnato come le action.
      # I due WARNING sugli hash sono attesi: qui non si installa niente.
      - name: Cerca advisory pubblicati
        run: uvx pip-audit@2.10.1 --progress-spinner off --no-deps -r dipendenze.txt
