# Analisi di sicurezza del codice. CodeQL segue il dato da dove entra a dove
# viene usato (percorsi e comandi composti con input esterno), cio' che ruff
# e mypy non vedono e che conta per un programma che apre archivi e lancia
# sottoprocessi.
#
# Fuori dai controlli obbligatori: un risultato e' un'ipotesi da leggere
# nella scheda Security, e un falso positivo non deve bloccare il merge.

name: CodeQL

on:
  push:
    branches:
      - main
    # Filtro per percorso possibile solo perche' CodeQL non e' obbligatorio
    # (vedi il job `modifiche` in ci.yml).
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  # Settimanale, perche' le query cambiano anche se il codice sta fermo.
  # Cron in UTC: 05:00, fra l'audit (04:00) e Dependabot (06:00).
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analisi:
    name: CodeQL · Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      # Per scrivere gli avvisi nella scheda Security.
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Action pinnate al commit: un tag si sposta, uno SHA no.
      - name: Inizializza CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          # Solo sicurezza: la manutenibilita' la coprono gia' ruff e mypy.
          queries: security-extended

      # Niente `autobuild`: per Python non serve, e si risparmia un `uv sync`.
      - name: Analizza
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:python"
