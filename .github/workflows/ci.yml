name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Serve un job che guardi *cosa* e' cambiato, perche' i tre check richiesti
  # dal ruleset non si possono spegnere con `paths-ignore`: una workflow
  # saltata per percorso lascia i check in "Pending" e blocca il merge per
  # sempre. Un job saltato da una condizione, invece, riporta "Success" - e'
  # il documento GitHub a dirlo - quindi il nome obbligatorio resta e il
  # lavoro non gira quando il commit tocca solo la documentazione.
  modifiche:
    name: Cosa cambia
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      solo_documenti: ${{ steps.filtro.outputs.solo_documenti }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Il diff ha bisogno del commit di partenza, non solo dell'ultimo.
          fetch-depth: 0

      # Un falso "solo documenti" salterebbe le prove, quindi il default e'
      # "cambia qualcosa": se la base non si legge, se il diff fallisce o se
      # l'elenco e' vuoto, i job girano. Si risparmia solo quando si e'
      # sicuri, mai il contrario.
      - name: Guarda cosa e' cambiato
        id: filtro
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          solo="false"
          if [ -n "${BASE:-}" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            cambiati=$(git diff --name-only "$BASE" "$GITHUB_SHA" || true)
            if [ -n "$cambiati" ]; then
              altro=$(printf '%s\n' "$cambiati" | grep -vE '^$|\.md$|^docs/' || true)
              if [ -z "$altro" ]; then
                solo="true"
              fi
            fi
          fi
          echo "solo_documenti=$solo" >> "$GITHUB_OUTPUT"

  qualita:
    name: Analisi statica
    needs: modifiche
    # `always()` perche' su un `modifiche` fallito l'output e' vuoto: la
    # condizione diventa vera e il lavoro gira lo stesso. Un check
    # obbligatorio non deve poter saltare perche' e' fallito chi lo decide.
    if: always() && needs.modifiche.outputs.solo_documenti != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installa uv
        run: python -m pip install --disable-pip-version-check uv==0.12.2

      # Un solo sistema, non la matrice: ruff e mypy danno lo stesso esito su
      # Ubuntu e Windows, e pagarli due volte allunga la CI senza aggiungere
      # informazione. Le differenze fra i due sistemi le trovano le prove.
      #
      # `--locked` rifiuta un uv.lock non allineato al pyproject invece di
      # riscriverlo: un lock stantio deve fallire qui, non installare altro.
      # Il gruppo dev - ruff, mypy, coverage - entra di default.
      - name: Sincronizza l'ambiente
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: uv sync --locked --python python

      - name: Lint
        run: ./.venv/bin/python -m ruff check .

      - name: Formattazione
        run: ./.venv/bin/python -m ruff format --check .

      # Senza `ignore_missing_imports`: l'albero delle dipendenze e' tipizzato,
      # quindi mypy risolve tutto davvero. Serve percio' l'ambiente completo.
      - name: Tipi
        run: ./.venv/bin/python -m mypy .

  tests:
    # Il nome porta la versione perche' ora ce n'e' piu' d'una, e resta
    # identico a prima dove la versione e' 3.12: i due check richiesti dal
    # ruleset si chiamano ancora "Python 3.12 · ubuntu-24.04" e
    # "Python 3.12 · windows-latest", e un nome cambiato li avrebbe fatti
    # risultare mancanti su ogni PR.
    name: Python ${{ matrix.py }} · ${{ matrix.os }}
    needs: modifiche
    if: always() && needs.modifiche.outputs.solo_documenti != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      # 3.12 e' la versione che setup installa e che entrambi i sistemi
      # provano; 3.13 e' l'altro estremo di `requires-python`, e senza un
      # giro qui quel vincolo direbbe una cosa che nessuno ha verificato.
      # Su Ubuntu soltanto: cio' che cambia fra 3.12 e 3.13 e' l'interprete,
      # non il sistema, e le differenze fra i due sistemi le trova gia' la
      # riga di sopra. E' un canarino, non una guardia: la 3.13 non e' fra i
      # controlli obbligatori del ruleset, come CodeQL e Audit e per lo
      # stesso motivo - se un giorno diventa rossa va letta, non aggirata.
      matrix:
        include:
          - os: ubuntu-24.04
            py: "3.12"
            python: ./.venv/bin/python
          - os: ubuntu-24.04
            py: "3.13"
            python: ./.venv/bin/python
          - os: windows-latest
            py: "3.12"
            python: ./.venv/Scripts/python.exe

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.py }}

      - name: Installa uv
        run: python -m pip install --disable-pip-version-check uv==0.12.2

      - name: Sincronizza l’ambiente
        if: runner.os != 'Windows'
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: |
          uv sync --locked --python python
          uv pip check --python "${{ matrix.python }}"

      - name: Prepara l’ambiente Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: ./setup.ps1 -SkipPreflight

      # `setup.ps1` e' il percorso d'installazione che l'utente Windows
      # esegue davvero, e va provato cosi' com'e': senza il gruppo dev. La
      # misura pero' vuole `coverage`, e lo stesso `sync --locked` sullo
      # stesso venv lo aggiunge senza toccare il resto: e' un secondo passo,
      # non una variante dello script.
      - name: Aggiungi gli strumenti di sviluppo
        if: runner.os == 'Windows'
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: uv sync --locked --python python

      # L'elenco dei moduli era scritto a mano e si era gia' perso
      # `turn_core.py`, aggiunto dopo. Qui l'esclusione e' esplicita e il
      # resto e' automatico: un modulo nuovo entra da solo.
      - name: Compila il codice
        run: ${{ matrix.python }} -m compileall -q -x "([\\/])(\.venv|\.git|htmlcov)([\\/]|$)" .

      # Un passo solo, e la stessa riga che si scrive in locale: tre passi
      # separati significavano che aggiungere una prova voleva dire
      # ricordarsi di aggiungerla anche qui, e una prova dimenticata in CI
      # e' una prova che non esiste.
      #
      # Con la misura su entrambi i sistemi. La copertura di un progetto non
      # dipende dal sistema, ma i rami si': i percorsi Windows di `backup` e
      # `platform_files` esistono per Windows, e misurati solo su Ubuntu
      # risultavano scoperti anche quando il runner Windows li attraversava.
      - name: Prove offline
        run: ${{ matrix.python }} tests/run.py --copertura
