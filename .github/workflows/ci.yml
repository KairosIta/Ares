name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: ./.venv/bin/python
          - os: windows-latest
            python: ./.venv/Scripts/python.exe

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installa uv
        run: python -m pip install --disable-pip-version-check uv==0.11.29

      - name: Sincronizza l’ambiente
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: |
          uv venv --python python .venv
          uv pip sync --python "${{ matrix.python }}" requirements.txt
          uv pip check --python "${{ matrix.python }}"

      - name: Compila il codice
        run: ${{ matrix.python }} -m compileall -q assistant.py backup.py chat.py cli_input.py cli_ui.py config.py entity_maintenance.py inspect_learning.py platform_files.py preflight.py schemas.py state_lock.py stores.py tests

      - name: Smoke test
        run: ${{ matrix.python }} tests/smoke_test.py

      - name: Backup e restore
        run: ${{ matrix.python }} tests/backup_test.py

      - name: Manutenzione entità
        run: ${{ matrix.python }} tests/entity_maintenance_test.py
