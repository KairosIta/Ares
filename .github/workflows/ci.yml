name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # I check obbligatori del ruleset non si possono saltare con `paths-ignore`:
  # una workflow saltata per percorso resta "Pending" e blocca il merge. Un
  # job saltato da una condizione riporta invece "Success": questo job decide
  # se il commit tocca solo documentazione, e gli altri saltano di conseguenza.
  modifiche:
    name: Cosa cambia
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      solo_documenti: ${{ steps.filtro.outputs.solo_documenti }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Il diff ha bisogno del commit di partenza, non solo dell'ultimo.
          fetch-depth: 0

      # Nel dubbio (base illeggibile, diff fallito, elenco vuoto) le prove
      # girano: si salta solo quando si e' sicuri.
      - name: Guarda cosa e' cambiato
        id: filtro
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          solo="false"
          if [ -n "${BASE:-}" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            cambiati=$(git diff --name-only "$BASE" "$GITHUB_SHA" || true)
            if [ -n "$cambiati" ]; then
              altro=$(printf '%s\n' "$cambiati" | grep -vE '^$|\.md$|^docs/' || true)
              if [ -z "$altro" ]; then
                solo="true"
              fi
            fi
          fi
          echo "solo_documenti=$solo" >> "$GITHUB_OUTPUT"

  qualita:
    name: Analisi statica
    needs: modifiche
    # `always()`: se `modifiche` fallisce l'output e' vuoto e il lavoro gira
    # lo stesso, invece di saltare.
    if: always() && needs.modifiche.outputs.solo_documenti != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installa uv
        run: python -m pip install --disable-pip-version-check uv==0.12.2

      # Un solo sistema: ruff e mypy danno lo stesso esito ovunque.
      # `--locked` fa fallire un uv.lock non allineato invece di riscriverlo.
      - name: Sincronizza l'ambiente
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: uv sync --locked --python python

      - name: Lint
        run: ./.venv/bin/python -m ruff check .

      - name: Formattazione
        run: ./.venv/bin/python -m ruff format --check .

      # I tre file di `tests/` sono il cablaggio delle prove, che `exclude`
      # terrebbe fuori: nominati qui, mypy li controlla (vedi pyproject.toml).
      - name: Tipi
        run: ./.venv/bin/python -m mypy . tests/run.py tests/_comune.py tests/_doppi.py

  tests:
    # Il ruleset richiede i check "Python 3.12 · ubuntu-24.04" e
    # "Python 3.12 · windows-latest": cambiare questo nome li farebbe
    # risultare mancanti su ogni PR.
    name: Python ${{ matrix.py }} · ${{ matrix.os }}
    needs: modifiche
    # Il job gira sempre e saltano solo i passi pesanti: un job a matrice
    # saltato non espande la matrice, i check richiesti non nascerebbero e il
    # merge resterebbe bloccato.
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      # 3.12 e' la versione installata dai setup, su entrambi i sistemi. 3.13
      # e' l'altro estremo di `requires-python`, solo su Ubuntu e non
      # obbligatoria: se diventa rossa va letta, non aggirata.
      matrix:
        include:
          - os: ubuntu-24.04
            py: "3.12"
            python: ./.venv/bin/python
          - os: ubuntu-24.04
            py: "3.13"
            python: ./.venv/bin/python
          - os: windows-latest
            py: "3.12"
            python: ./.venv/Scripts/python.exe

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.py }}

      - name: Installa uv
        run: python -m pip install --disable-pip-version-check uv==0.12.2

      # Da qui i passi pesanti, saltati quando il commit tocca solo
      # `*.md`/`docs/`.
      - name: Sincronizza l’ambiente
        if: runner.os != 'Windows' && needs.modifiche.outputs.solo_documenti != 'true'
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: |
          uv sync --locked --python python
          uv pip check --python "${{ matrix.python }}"

      - name: Prepara l’ambiente Windows
        if: runner.os == 'Windows' && needs.modifiche.outputs.solo_documenti != 'true'
        shell: pwsh
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: ./setup.ps1 -SkipPreflight

      # `setup.ps1` si prova cosi' com'e', senza gruppo dev; la misura vuole
      # pero' `coverage`, che questo passo aggiunge allo stesso venv.
      - name: Aggiungi gli strumenti di sviluppo
        if: runner.os == 'Windows' && needs.modifiche.outputs.solo_documenti != 'true'
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: uv sync --locked --python python

      # Tutto tranne le esclusioni esplicite: un modulo nuovo entra da solo.
      - name: Compila il codice
        if: needs.modifiche.outputs.solo_documenti != 'true'
        run: ${{ matrix.python }} -m compileall -q -x "([\\/])(\.venv|\.git|htmlcov)([\\/]|$)" .

      # La stessa riga che si usa in locale, cosi' una prova nuova entra da
      # sola. Misura su entrambi i sistemi, perche' i rami Windows si coprono
      # solo li'.
      - name: Prove offline
        if: needs.modifiche.outputs.solo_documenti != 'true'
        run: ${{ matrix.python }} tests/run.py --copertura
